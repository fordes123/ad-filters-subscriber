# AD Filter Subscriber 参考配置
# 复制为 config/application.yaml 后按需修改。

application:
  # 规则源列表，至少需要一项。
  input:
    # 远程规则源示例。
    - name: upstream
      # name 与 path 必填；name 在 input 中不可重复。
      path: https://example.org/filter.txt
      # 可选，默认 easylist。
      # 可用值：easylist、dns、hosts、dnsmasq、smartdns、clash、sing-box。
      type: easylist
      # EasyList/DNS：abp、adguard、ubo；Clash：classical、domain、ipcidr。
      # 其他格式无需配置 dialect。
      dialect: ubo
      # 可选，默认 0。数值越大，该规则源越先处理。
      priority: 10

    # 本地规则源示例；相对路径基于程序工作目录。
    - name: local-hosts
      path: rules/local-hosts.txt
      type: hosts

  output:
    # 可选，默认 rule。所有输出文件都写入该目录。
    path: rule

    # 可选的全局文件头。支持：
    # ${name} 文件名、${type} 输出格式、${desc} 文件描述、
    # ${date} 生成时间、${total} 输出规则数。
    # sing-box 是严格 JSON，不会写入文件头。
    file_header: |
      AD Filter Subscriber ${type}
      Last Modified: ${date}
      Description: ${desc}
      Total Rules: ${total}

    # 输出文件列表，至少需要一项；生成路径不可重复。
    files:
      - name: easylist.txt
        # type 必填；可用值与 input.type 相同。
        type: easylist
        dialect: ubo
        desc: Browser ad-block rules
        # 每个文件可通过 file_header 覆盖全局文件头。
        # file_header: |
        #   Custom header for ${name}
        # 可选，仅合并指定的规则源；省略时使用全部规则源。
        rule:
          - upstream
          - local-hosts

      - name: adguard-dns.txt
        type: dns
        dialect: adguard
        desc: AdGuard DNS rules

      - name: hosts.txt
        type: hosts
        desc: Hosts rules

      - name: dnsmasq.conf
        type: dnsmasq
        desc: dnsmasq rules

      - name: smartdns.conf
        type: smartdns
        desc: SmartDNS rules

      - name: mihomo.yaml
        type: clash
        # classical 输出 payload 规则；domain 输出域名集；ipcidr 输出 IP CIDR 集。
        dialect: classical
        desc: Mihomo classical rule provider

      - name: sing-box.json
        type: sing-box
        desc: sing-box rule set

  # 规则源加载配置可整体省略。
  source-loading:
    # 本地文件和 HTTP 响应的默认字符集。
    local-charset: UTF-8
    http-charset: UTF-8
    # 本地与 HTTP 输入共用的读取缓冲区，不能小于 1KB。
    buffer-size: 4KB
    connect-timeout: 10s
    request-timeout: 30s

  # 规则处理配置可整体省略。
  processing:
    # 0 表示不限制；启用上限时，min-rule-length 不能大于 max-rule-length。
    min-rule-length: 0
    max-rule-length: 0
    # 排除精确域名和域名后缀规则；比较时不区分大小写。
    excluded-domains: [ ]
    # 示例：
    # excluded-domains:
    #   - trusted.example
    # 允许缩小匹配范围：可能增加漏拦截，不会因此增加误拦截。
    allow-narrowing: true
    # 允许放大匹配范围：可能增加误拦截。
    allow-broadening: false

    dns-validation:
      # 启用后，仅探测可确定域名的 BLOCK 规则。
      # 仅有有效 NXDOMAIN 会删除规则；超时或服务器错误会使构建失败。
      enabled: false
      # enabled=true 时必填；只能配置一个 DNS 服务器。
      server: 1.1.1.1
      port: 53
      # UDP 查询与 TC 触发的 TCP 重试共用该超时时间。
      timeout: 1s
      # 同时在途的查询上限，取值范围 1..1024。
      concurrency: 128

  # 转换日志配置可整体省略。
  logging:
    # 是否将成功转换的逐规则记录写入 conversion.log；默认 false。
    # 失败记录始终写入。
    include-successful-conversions: false
