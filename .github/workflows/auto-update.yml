name: Update Filters

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'README_en.md'
      - '.github/**'
      - '.devcontainer/**'
      - 'LICENSE'
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      release-branch:
        description: Release branch name
        required: false
        default: release
        type: string

env:
  TZ: Asia/Shanghai

concurrency:
  group: update-filters-${{ inputs.release-branch || 'release' }}
  cancel-in-progress: false

jobs:
  update-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build filters
        run: |
          mvn -B -DskipTests package
          java -jar "$(find target -maxdepth 1 -name 'adfs-*.jar' ! -name '*-shaded.jar')" build --config config/application.yaml --output-directory rule

      - name: Upload conversion log
        uses: actions/upload-artifact@v7
        with:
          name: conversion.log
          path: conversion.log

      - name: Prepare release contents
        run: |
          find . -maxdepth 1 ! -name 'rule' ! -name '.' ! -name '.git' -exec rm -rf -- {} +
          mv rule/* .
          rm -rf rule

      - name: Commit release contents
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update filters'
          branch: ${{ inputs.release-branch || 'release' }}
          push_options: '--force'
          create_branch: true
          skip_fetch: true
          skip_checkout: true
