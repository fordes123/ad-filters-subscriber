name: Update Filters

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - '.devcontainer/**'
      - 'LICENSE'
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      release-branch:
        description: Release branch name
        required: false
        default: release
        type: string

env:
  TZ: Asia/Shanghai

concurrency:
  group: update-filters-${{ inputs.release-branch || 'release' }}
  cancel-in-progress: false

jobs:
  update-filters:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Build filters
        run: |
          bash ./gradlew --no-daemon shadowJar
          mkdir -p logs
          java -jar "$(find build/libs -maxdepth 1 -name 'adfs-*-all.jar')" -c config/application.yaml

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/*.log

      - name: Prepare release contents
        run: |
          find . -maxdepth 1 ! -name 'rule' ! -name '.' ! -name '.git' -exec rm -rf -- {} +
          mv rule/* .
          rm -rf rule

      - name: Commit release contents
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update filters'
          branch: ${{ inputs.release-branch || 'release' }}
          push_options: '--force'
          create_branch: true
          skip_fetch: true
          skip_checkout: true
