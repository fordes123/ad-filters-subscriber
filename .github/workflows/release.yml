name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build release package
        run: |
          mvn -B "-Drevision=${{ steps.version.outputs.version }}" verify
          java -jar target/adfs-${{ steps.version.outputs.version }}.jar --version
          mkdir -p release
          cp target/adfs-${{ steps.version.outputs.version }}-jvm.zip release/

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: adfs-release
          path: release/adfs-${{ steps.version.outputs.version }}-jvm.zip

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_suffix: linux-x86_64
            executable: target/adfs
          - runner: windows-latest
            asset_suffix: windows-x86_64.exe
            executable: target/adfs.exe
          - runner: macos-15
            asset_suffix: macos-aarch64
            executable: target/adfs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native executable
        run: mvn -B -Pnative -DskipTests native:compile

      - name: Stage native executable
        shell: pwsh
        run: |
          & "${{ matrix.executable }}" --version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "${{ matrix.executable }}" -Destination "release/adfs-${{ needs.verify.outputs.version }}-${{ matrix.asset_suffix }}"

      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: adfs-${{ matrix.asset_suffix }}
          path: release/adfs-${{ needs.verify.outputs.version }}-${{ matrix.asset_suffix }}

  release:
    needs: [verify, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum adfs-* > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.verify.outputs.version }}
          files: release/*
          generate_release_notes: true
